services:
  # PostgreSQL Database (Ymmo Real Estate Platform)
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: ymmo-db
    environment:
      POSTGRES_DB: ymmo_db
      POSTGRES_USER: ymmo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepass123}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ymmo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymmo_user -d ymmo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django Web Application (Stan)
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.web
    container_name: ymmo-web
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: postgis://ymmo_user:${DB_PASSWORD:-securepass123}@db:5432/ymmo_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src/web:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - ymmo-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ymmo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    networks:
      - ymmo-network
    depends_on:
      - web
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ymmo-redis
    networks:
      - ymmo-network
    restart: unless-stopped

  # PgAdmin (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ymmo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ymmo.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - ymmo-network
    depends_on:
      - db
    restart: unless-stopped

networks:
  ymmo-network:
    driver: bridge

volumes:
  db_data:
  static_volume:
  media_volume:
