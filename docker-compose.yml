services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ymmo-db
    environment:
      POSTGRES_DB: ymmo_db
      POSTGRES_USER: ymmo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-P@sswordYmmoSQL!}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ymmo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymmo_user -d ymmo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django Web Application
  web:
    build:
      context: ./src/web
      dockerfile: ./Dockerfile
    container_name: ymmo-web
    environment:
      DEBUG: "True"
      SECRET_KEY: "ymmo-secret-key-2026"
      DATABASE_URL: postgresql://ymmo_user:${DB_PASSWORD:-P@sswordYmmoSQL!}@db:5432/ymmo_db
    ports:
      - "8000:8000"
    volumes:
      - ./src/web:/app
    networks:
      - ymmo-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ymmo-redis
    networks:
      - ymmo-network
    restart: unless-stopped

  # PgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ymmo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ymmo.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - ymmo-network
    depends_on:
      - db
    restart: unless-stopped

networks:
  ymmo-network:
    driver: bridge

volumes:
  db_data:
